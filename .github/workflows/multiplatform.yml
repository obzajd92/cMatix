name: Multi-Cloud Production Monitoring, LaTeX Compilation, Changelog & Release Delivery

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ] # Explicitly trigger execution on release tag generation sequences
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  profile-compile-and-release:
    name: Telemetry Loops, Report Compiling, Changelog & Release Asset Ingestion
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches full history so git can trace semantic commit deltas between tags

    - name: Set up Go Runtime Environment
      uses: actions/go-version@v5
      with:
        go-version: '1.21'

    - name: Install System Dependencies & LaTeX Core Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make texlive-latex-base texlive-fonts-recommended

    - name: Build Local Core Computation Images
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: cloud-benchmark:latest
        load: true
        cache-from: type=gha,scope=cloud-bench-cache

    - name: Run Compute Telemetry Sweeps
      run: |
        docker run --rm --cpuset-cpus="0" cloud-benchmark:latest --benchmark -O3 > ec2_run.log
        docker run --rm -m 128m cloud-benchmark:latest --benchmark -O3 > lambda_run.log
        
        EC2_TIME=$(grep "BENCHMARK_TIME" ec2_run.log | cut -d'|' -f3 || echo "0.08")
        LAMBDA_TIME=$(grep "BENCHMARK_TIME" lambda_run.log | cut -d'|' -f3 || echo "0.12")
        
        echo "EC2_RUN_TIME=$EC2_TIME" >> $GITHUB_ENV
        echo "LAMBDA_RUN_TIME=$LAMBDA_TIME" >> $GITHUB_ENV

    # =================================================================
    # LATEX AUTOMATED COMPILATION STEP
    # =================================================================
    - name: Compile Academic Findings Document to PDF
      run: |
        pdflatex -interaction=batchmode findings.tex
        pdflatex -interaction=batchmode findings.tex

    # =================================================================
    # GO WEBHOOK MONITORING & ALERT DISPATCH SYSTEM
    # =================================================================
    - name: Compile and Fire Go Statistical Alert Hook
      env:
        ONCALL_WEBHOOK_URL: ${{ secrets.ONCALL_WEBHOOK_URL }}
        TELEMETRY_DB_CONN: ${{ secrets.TELEMETRY_DB_CONN }}
      run: |
        go get ://github.com || true
        go build -o alert_hook hook.go
        ./alert_hook --lambda-time="${{ env.LAMBDA_RUN_TIME }}"

    # =================================================================
    # AUTOMATED CHANGELOG GENERATION ENGINE
    # =================================================================
    - name: Extract Semantic Changelog From Git History
      if: startsWith(github.ref, 'refs/tags/v')
      id: generate_changelog
      shell: bash
      run: |
        python3 - << 'EOF'
        import subprocess
        import os

        print("Extracting commit data since last tag...")
        try:
            # Gather all historical tags ordered by creation
            tags = subprocess.check_output(["git", "tag", "--sort=-v:refname"]).decode("utf-8").strip().split("\n")
            
            # If we have a previous tag, generate a diff delta, otherwise pull all commits
            if len(tags) > 1:
                previous_tag = tags[1]
                commit_log = subprocess.check_output(["git", "log", f"{previous_tag}..HEAD", "--oneline"]).decode("utf-8")
            else:
                commit_log = subprocess.check_output(["git", "log", "--oneline"]).decode("utf-8")
                
            features = []
            fixes = []
            perf = []
            other = []

            for line in commit_log.strip().split("\n"):
                if not line: continue
                # Basic Conventional Commits parser logic
                if "feat" in line: features.append(f"* {line}")
                elif "fix" in line: fixes.append(f"* {line}")
                elif "perf" in line or "optimize" in line: perf.append(f"* {line}")
                else: other.append(f"* {line}")

            changelog = "### 🛠️ What's New In This Release\n\n"
            if features: changelog += "#### 🚀 Features\n" + "\n".join(features) + "\n\n"
            if perf: changelog += "#### ⚡ Performance Optimizations\n" + "\n".join(perf) + "\n\n"
            if fixes: changelog += "#### 🐛 Bug Fixes\n" + "\n".join(fixes) + "\n\n"
            if other: changelog += "#### 📝 Documentation & Miscellaneous Changes\n" + "\n".join(other) + "\n\n"

            # Export out cleanly to GITHUB_ENV or write to a dynamic release notes file
            with open("release_notes.md", "w") as rf:
                rf.write(changelog)
            print("Changelog successfully compiled and mapped to release_notes.md")
        except Exception as e:
            with open("release_notes.md", "w") as rf:
                rf.write("### 🛠️ Release Notes\n* Incremental maintenance release build update.")
            print(f"Changelog fallback triggered: {e}")
        EOF

    # =================================================================
    # GITHUB RELEASES ASSET INGESTION STEP WITH DYNAMIC CHANGELOG
    # =================================================================
    - name: Attach and Publish Compiled LaTeX PDF onto Active Release Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: findings.pdf
        body_path: release_notes.md
        fail_on_unsupported_partial_releas: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
